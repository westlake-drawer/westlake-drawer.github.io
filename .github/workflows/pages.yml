name: Build and Deploy Pages

on:
  # Pull requests are checked but never published. Pushes do not deploy.
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
  schedule:
    # 03:23 Asia/Shanghai / Asia/Singapore, away from the hourly peak.
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      refresh_repositories:
        description: Refresh upstream repository snapshots even when cached
        type: boolean
        default: false
      force_build:
        description: Rebuild and deploy even when site inputs are unchanged
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.build-plan.outputs.changed }}
      content_sha: ${{ steps.content-version.outputs.sha }}
    concurrency:
      group: pages-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Check out the content repository
        uses: actions/checkout@v4
        with:
          repository: westlake-drawer/notes-index
          ref: main
          path: .content-source
          persist-credentials: false
      - name: Record content revision
        id: content-version
        working-directory: .content-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore last successfully published fingerprints
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .cache/pages/published.json
          key: pages-published-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-published-v1-
      - name: Check site source changes before installing dependencies
        id: source-plan
        run: node scripts/plan-pages.mjs source
        env:
          REFRESH_REPOSITORIES: ${{ inputs.refresh_repositories }}
          FORCE_BUILD: ${{ inputs.force_build }}
      - uses: actions/setup-node@v4
        if: steps.source-plan.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.source-plan.outputs.changed == 'true'
        run: npm ci --no-audit --no-fund
      - name: Restore repository snapshots
        if: steps.source-plan.outputs.changed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/repositories
          key: repository-snapshots-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: repository-snapshots-v1-
      - if: steps.source-plan.outputs.changed == 'true'
        run: npm test
      - name: Sync linked repository contributors and documents
        if: steps.source-plan.outputs.changed == 'true'
        run: |
          if [ "$REFRESH_REPOSITORIES" = "true" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            npm run sync:repositories -- --force
          else
            npm run sync:repositories
          fi
        env:
          REFRESH_REPOSITORIES: ${{ inputs.refresh_repositories }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check effective site changes after synchronization
        if: steps.source-plan.outputs.changed == 'true'
        id: build-plan
        run: node scripts/plan-pages.mjs build
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
      - name: Save repository snapshots even when nothing needs publishing
        if: steps.source-plan.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .cache/repositories
          key: repository-snapshots-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore compilation cache
        if: steps.build-plan.outputs.changed == 'true'
        uses: actions/cache/restore@v4
        id: compilation-cache
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-${{ runner.arch }}-node22-build-v3-${{ hashFiles('package-lock.json', 'docusaurus.config.js', 'sidebars.js') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node22-build-v3-${{ hashFiles('package-lock.json', 'docusaurus.config.js', 'sidebars.js') }}-
      - name: Fetch full history only when generating last-updated dates
        if: steps.build-plan.outputs.changed == 'true'
        working-directory: .content-source
        run: git fetch --unshallow --no-tags
      - if: steps.build-plan.outputs.changed == 'true'
        run: npm run build
      - name: Save compilation cache
        if: steps.build-plan.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.build-plan.outputs.changed == 'true' && github.event_name != 'pull_request'
        with:
          path: build
      - name: Upload candidate publication fingerprints
        if: steps.build-plan.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pages-publication-state
          path: .cache/pages/candidate.json
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check this is still the latest main commit
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main',
            });
            const {data: content} = await github.rest.git.getRef({
              owner: 'westlake-drawer', repo: 'notes-index', ref: 'heads/main',
            });
            const current = context.ref === 'refs/heads/main' &&
              data.object.sha === context.sha &&
              content.object.sha === '${{ needs.build.outputs.content_sha }}';
            core.setOutput('current', current);
            if (!current) {
              core.notice('Skipping deployment: the engine or content main branch has changed.');
            }
      - name: Deploy
        if: steps.latest.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Download successfully published fingerprints
        if: steps.latest.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pages-publication-state
          path: .cache/pages
      - name: Record successful publication
        if: steps.latest.outputs.current == 'true'
        run: mv .cache/pages/candidate.json .cache/pages/published.json
      - name: Save published fingerprints only after deployment succeeds
        if: steps.latest.outputs.current == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/pages/published.json
          key: pages-published-v1-${{ github.run_id }}-${{ github.run_attempt }}
